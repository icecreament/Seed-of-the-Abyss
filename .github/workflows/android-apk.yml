name: Build Android APK

# 不装 Android Studio：推到 GitHub 后，用 Actions 云端打包
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'PACKAGING.md'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      # AGP 8.2.1 / Gradle 8.2.1 只支持到 JDK 17，升到 21 反而会挂。
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 必须用 v4+：v3 固定去下载已被 Google 下线的 cmdline-tools 版本，
      # 会在这里直接失败（本次 #9 的报错点）；v4 起跟进 cmdline-tools 22.0。
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          node -v && npm -v
          java -version
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-<unset>}}"
          sdkmanager --version || true

      - name: Install SDK platform for compileSdk 34
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::ANDROID_SDK_ROOT / ANDROID_HOME 都未设置，setup-android 可能没生效"
            exit 1
          fi
          yes | sdkmanager --licenses > /dev/null || true
          # 镜像通常已带 android-34；缺失时才装，省一次几十秒的下载。
          if [ ! -d "$SDK/platforms/android-34" ]; then
            sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi

      - name: Install deps
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Ensure Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Write local.properties
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?ANDROID_SDK_ROOT/ANDROID_HOME 都为空}}"
          echo "sdk.dir=$SDK" > android/local.properties
          cat android/local.properties

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SeedOfTheAbyss-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
