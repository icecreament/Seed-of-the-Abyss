name: Build Android APK

# 不装 Android Studio：推到 GitHub 后，用 Actions 云端打包
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'PACKAGING.md'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Ensure Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          # fallback if ANDROID_SDK_ROOT empty
          if [ ! -s android/local.properties ] || grep -q 'sdk.dir=$' android/local.properties; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          fi
          cat android/local.properties

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SeedOfTheAbyss-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
